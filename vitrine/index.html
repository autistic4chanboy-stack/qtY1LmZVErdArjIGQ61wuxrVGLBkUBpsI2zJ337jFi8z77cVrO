<head>

<body>
<title>Newy and the Dark Forest</title>
<meta name="description" content="Captures, cartes, musiques et affiches de Newy and the Dark Forest.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+French+Canon:ital@0;1&family=Spectral:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap">
<style>
/* Un album de la vallée, la nuit : une couverture (la ville à l'heure dorée), puis des chapitres empilés,
   chacun une courte légende et une planche de vignettes ; la musique en bas, avec un lecteur collé au pied de l'écran.
   Une seule ambiance, sombre, celle de l'écran titre du jeu (ambre sur nuit). */
:root {
  --nuit: #0d0c10;
  --nuit-2: #16141a;
  --nuit-3: #211e25;
  --parchemin: #eee4cc;
  --brume: #a69e8c;
  --ambre: #ffc93c;
  --ambre-doux: rgba(255, 201, 60, .74);
  --filet: rgba(255, 201, 60, .22);
  --voile: rgba(13, 12, 16, .9);
  --f-titre: 'IM Fell French Canon', Georgia, 'Times New Roman', serif;
  --f-texte: 'Spectral', Georgia, 'Times New Roman', serif;
  --gouttiere: clamp(16px, 4vw, 48px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }
body { margin: 0; background: var(--nuit); color: var(--parchemin); font-family: var(--f-texte); font-weight: 300; font-size: 18px; line-height: 1.55; }
a { color: var(--ambre); }
img { max-width: 100%; display: block; }
:focus-visible { outline: 2px solid var(--ambre); outline-offset: 3px; }

/* la couverture */
.couverture { position: relative; min-height: min(78vh, 760px); display: flex; align-items: flex-end; padding-inline: var(--gouttiere); padding-block: 96px 56px;
  background: linear-gradient(90deg, rgba(13, 12, 16, .9) 0%, rgba(13, 12, 16, .55) 38%, rgba(13, 12, 16, 0) 70%), linear-gradient(0deg, var(--nuit) 0%, rgba(13, 12, 16, 0) 45%), url('img/valbrume_soir.jpg') center 40% / cover no-repeat; }
.couverture .bloc { max-width: 640px; min-width: 0; }
@media (max-width: 640px) { .couverture { padding-block: 72px 40px; background: linear-gradient(0deg, var(--nuit) 0%, rgba(13, 12, 16, .78) 55%, rgba(13, 12, 16, .45) 100%), url('img/valbrume_soir.jpg') 30% 40% / cover no-repeat; } }
.surtitre { font-family: var(--f-texte); font-weight: 400; font-size: 13px; letter-spacing: .24em; text-transform: uppercase; color: var(--ambre-doux); margin: 0; }
h1 { font-family: var(--f-titre); font-weight: 400; color: var(--ambre); letter-spacing: .16em; line-height: 1; margin: 18px 0 0; font-size: clamp(64px, 12vw, 150px); text-shadow: 0 0 26px rgba(255, 201, 60, .25); }
.sous-titre { font-family: var(--f-titre); font-style: italic; font-size: clamp(26px, 4vw, 46px); margin: 8px 0 0; letter-spacing: .04em; }
.accroche { font-size: clamp(19px, 2.2vw, 24px); margin: 28px 0 0; max-width: 34ch; text-wrap: balance; }
.faits { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 18px 28px; margin: 36px 0 0; padding: 22px 0 0; border-top: 1px solid var(--filet); max-width: 640px; }
.faits div { min-width: 0; }
.faits dt { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--brume); font-weight: 400; }
.lien-jeu { display: inline-block; margin-top: 28px; padding: 10px 20px; border: 1px solid var(--ambre); border-radius: 4px; color: var(--ambre); text-decoration: none; font-weight: 400; letter-spacing: .04em; }
.lien-jeu:hover { background: rgba(255, 201, 60, .1); }
.faits dd { margin: 4px 0 0; font-family: var(--f-titre); font-size: 22px; font-variant-numeric: tabular-nums; }

/* les chapitres */
nav.chapitres { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--voile); backdrop-filter: blur(6px); border-bottom: 1px solid var(--filet); }
nav.chapitres ul { list-style: none; margin: 0; padding-inline: var(--gouttiere); padding-block: 10px; display: flex; gap: 6px 22px; overflow-x: auto; scrollbar-width: none; }
nav.chapitres a { color: var(--brume); text-decoration: none; white-space: nowrap; font-size: 15px; font-weight: 400; }
nav.chapitres a:hover { color: var(--ambre); }
main { padding-inline: var(--gouttiere); padding-block: 24px 140px; max-width: 1480px; margin: 0 auto; }
section.chapitre { padding-block: 64px 8px; scroll-margin-top: 56px; }
.entete { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 12px 48px; align-items: end; margin-bottom: 26px; }
@media (max-width: 760px) { .entete { grid-template-columns: minmax(0, 1fr); } }
h2 { font-family: var(--f-titre); font-weight: 400; font-size: clamp(36px, 5vw, 56px); line-height: 1.05; margin: 0; color: var(--parchemin); text-wrap: balance; }
h2 em { color: var(--ambre); font-style: italic; }
.entete p { margin: 0; color: var(--brume); max-width: 62ch; }

/* les planches de vignettes */
.planche { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 14px; }
.planche figure { margin: 0; min-width: 0; }
.planche button { all: unset; cursor: zoom-in; display: block; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 3px; background: var(--nuit-2); }
.planche button:focus-visible { outline: 2px solid var(--ambre); outline-offset: 3px; }
.planche img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease, filter .3s ease; filter: saturate(.96); }
.planche button:hover img { transform: scale(1.03); filter: saturate(1.06); }
.planche figcaption { font-style: italic; font-size: 15px; color: var(--brume); margin-top: 7px; line-height: 1.35; }
@media (min-width: 900px) { .planche .une { grid-column: span 2; grid-row: span 2; } .planche .une figcaption { font-size: 17px; color: var(--parchemin); } }
.planche.affiches { grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); align-items: start; }
.planche.affiches button { aspect-ratio: auto; }
.planche.affiches img { height: auto; object-fit: contain; }
@media (min-width: 900px) { .planche.affiches .une { grid-row: auto; } }

/* ce qu'on y fait */
.activites { columns: 2 320px; column-gap: 48px; margin: 0 0 34px; padding: 0; list-style: none; }
.activites li { break-inside: avoid; padding: 10px 0; border-top: 1px solid var(--filet); }
.activites b { font-weight: 600; color: var(--parchemin); }
.activites span { color: var(--brume); }
.semaine { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0 0 30px; padding: 0; list-style: none; font-family: var(--f-titre); font-style: italic; font-size: 19px; color: var(--ambre-doux); }
.semaine li { white-space: nowrap; }
.note { color: var(--brume); font-size: 15px; margin: -14px 0 26px; }

/* la musique */
.zones { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 30px 48px; }
.zone { min-width: 0; }
.zone h3 { font-family: var(--f-titre); font-weight: 400; font-style: italic; font-size: 24px; margin: 0 0 8px; color: var(--ambre); }
.zone ol { list-style: none; margin: 0; padding: 0; }
.piste { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; padding: 9px 8px; border-top: 1px solid var(--filet); border-radius: 2px; }
.piste:hover { background: var(--nuit-2); }
.piste:focus-visible { outline: 2px solid var(--ambre); outline-offset: -2px; }
.piste .ic { color: var(--ambre); font-size: 14px; text-align: center; }
.piste .t { font-weight: 400; color: var(--parchemin); }
.piste .a { grid-column: 2 / 4; font-size: 14px; color: var(--brume); font-style: italic; margin-top: -2px; }
.piste .d { font-size: 14px; color: var(--brume); font-variant-numeric: tabular-nums; }
.piste[aria-pressed="true"] { background: var(--nuit-3); }
.piste[aria-pressed="true"] .t { color: var(--ambre); }

/* le lecteur, au pied de l'écran */
.lecteur { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--voile); backdrop-filter: blur(8px); border-top: 1px solid var(--filet);
  padding-inline: var(--gouttiere); padding-top: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 16px; align-items: center; }
.lecteur button { all: unset; cursor: pointer; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--filet); color: var(--ambre); font-size: 15px; }
.lecteur button:hover { background: var(--nuit-3); }
.lecteur button:focus-visible { outline: 2px solid var(--ambre); outline-offset: 2px; }
.lecteur .quoi { min-width: 0; }
.lecteur .quoi b { display: block; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lecteur .quoi span { display: block; font-size: 13px; color: var(--brume); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lecteur input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--ambre); margin: 0; }
.lecteur .boutons { display: flex; gap: 8px; }

/* la visionneuse */
.visionneuse { position: fixed; inset: 0; z-index: 10; background: #09080b; display: grid; grid-template-rows: minmax(0, 1fr) auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
.visionneuse img { max-width: 100%; max-height: 100%; margin: auto; object-fit: contain; border-radius: 2px; }
.visionneuse .bas { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 12px; }
.visionneuse p { margin: 0; font-style: italic; color: var(--parchemin); min-width: 0; }
.visionneuse p span { color: var(--brume); font-style: normal; font-size: 14px; margin-left: 10px; font-variant-numeric: tabular-nums; }
.visionneuse .boutons { display: flex; gap: 8px; flex: none; }
.visionneuse button { all: unset; cursor: pointer; padding: 8px 14px; border: 1px solid var(--filet); border-radius: 3px; color: var(--ambre); font-size: 15px; }
.visionneuse button:hover { background: var(--nuit-3); }
.visionneuse button:focus-visible { outline: 2px solid var(--ambre); outline-offset: 2px; }

footer { border-top: 1px solid var(--filet); margin-top: 72px; padding-top: 22px; color: var(--brume); font-size: 15px; display: grid; gap: 8px; max-width: 80ch; }
</style>

  <div class="bloc">
    <p class="surtitre">Un jeu de ferme au XIXᵉ siècle</p>
    <h1>NEWY</h1>

</header>

</div>

 min 42","zone":"Les Ténèbres"},{"n":36,"mp3":"36-enfers_portes.mp3","titre":"Les portes","auteur":"composition originale (agent M)","instr":"orgue, cordes, cloche","duree":"2 min 02","zone":"Les Enfers"},{"n":37,"mp3":"37-enfers_fleuve.mp3","titre":"Le fleuve de braise","auteur":"composition originale (agent M)","instr":"cordes, piano, cloche","duree":"2 min 06","zone":"Les Enfers"},{"n":38,"mp3":"38-enfers_descente.mp3","titre":"Descente","auteur":"composition originale (agent M)","instr":"orgue, cordes","duree":"1 min 46","zone":"Les Enfers"},{"n":39,"mp3":"39-pd_bach846.mp3","titre":"Prélude en ut majeur, BWV 846","auteur":"Jean-Sébastien Bach (1722)","instr":"harpe, cordes","duree":"2 min 37","zone":"La cité vaisseau"},{"n":40,"mp3":"40-vaisseau_cite.mp3","titre":"Cité dormante","auteur":"composition originale (agent M)","instr":"verre, célesta, nappe, harpe","duree":"2 min 12","zone":"La cité vaisseau"},{"n":41,"mp3":"41-vaisseau_hublots.mp3","titre":"Hublots","auteur":"composition originale (agent M)","instr":"piano, verre","duree":"2 min 01","zone":"La cité vaisseau"},{"n":42,"mp3":"42-vaisseau_jardins.mp3","titre":"Les jardins suspendus","auteur":"composition originale (agent M)","instr":"célesta, harpe, cordes","duree":"1 min 42","zone":"La cité vaisseau"}]};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ce qu'on y fait : la liste (les écrans suivent)
const ACTIVITES = [
  ['Cultiver la vieille ferme', 'semer, arroser, récolter ; la terre se fatigue à force de récoltes.'],
  ['Tenir une ruche', 'du miel, de la cire, et quelques piqûres.'],
  ['Pêcher et chasser', 'des poissons selon les eaux, un fusil à lunette, des pièges.'],
  ['Cueillir et identifier', 'chaque plante a son effet ; l’alchimiste de la ville dit ce qu’elle est.'],
  ['L’alambic', 'des mélanges à l’aveugle d’abord, puis des recettes qu’on garde d’une vie à l’autre.'],
  ['Fabriquer par assemblage', 'les recettes se découvrent en essayant.'],
  ['Vivre en ville', 'acheter ou louer une maison, la meubler, y dormir.'],
  ['Prendre des risques', 'crocheter une porte, chaparder ; les gardes, la prison, la rançon.'],
  ['Lire les pierres', 'deux langues perdues, gravées dans la vallée et dessous.'],
  ['Descendre, et partir', 'le Dessous, d’autres mondes, et une cité vaisseau qu’on ne visite qu’une fois.'],
];
const SEMAINE = ['Primedi', 'Ferdi', 'Marchedi', 'Lavedi', 'Nahédi', 'Chassedi', 'Pêchedi', 'Orédi', 'Foiredi', 'Veilledi', 'Chômedi', 'Vorndi'];

const toutes = []; // toutes les images, dans l'ordre de la page (pour la visionneuse)
function planche(ch) {
  return `<div class="planche${ch.affiches ? ' affiches' : ''}">` + ch.images.map((im, i) => {
    const k = toutes.push(im) - 1;
    const ratio = ch.affiches ? ` style="aspect-ratio:${im.w} / ${im.h}"` : '';
    return `<figure class="${i === 0 ? 'une' : ''}"><button type="button" data-k="${k}"${ratio} aria-label="Agrandir : ${esc(im.legende)}"><img src="min/${im.id}.jpg" alt="${esc(im.legende)}" loading="${k < 6 ? 'eager' : 'lazy'}" decoding="async"></button><figcaption>${esc(im.legende)}</figcaption></figure>`;
  }).join('') + '</div>';
}
let html = '';
const nav = [];
for (const ch of DATA.chapitres) {
  nav.push(`<li><a href="#${ch.id}">${esc(ch.titre)}</a></li>`);
  let avant = '';
  if (ch.id === 'vallee') avant = `<ul class="semaine" aria-label="Les douze jours de la semaine">${SEMAINE.map((j) => `<li>${j}</li>`).join('')}</ul><p class="note">La semaine de la vallée a douze jours.</p>`;
  if (ch.id === 'jouer') avant = `<ul class="activites">${ACTIVITES.map(([a, b]) => `<li><b>${esc(a)}</b> <span>— ${esc(b)}</span></li>`).join('')}</ul>`;
  html += `<section class="chapitre" id="${ch.id}"><div class="entete"><h2>${esc(ch.titre)}</h2>${ch.texte ? `<p>${esc(ch.texte)}</p>` : ''}</div>${avant}${planche(ch)}</section>`;
}
// la musique
nav.push('<li><a href="#musique">La musique</a></li>');
const zones = [];
for (const p of DATA.pistes) { let z = zones.find((x) => x.nom === p.zone); if (!z) zones.push(z = { nom: p.zone, pistes: [] }); z.pistes.push(p); }
const auteur = (p) => /composition originale/.test(p.auteur) ? 'Composition originale' : /arrangé/.test(p.auteur) ? 'Air populaire, arrangé' : p.auteur;
html += `<section class="chapitre" id="musique"><div class="entete"><h2>La musique</h2><p>Quarante-deux morceaux, quatre-vingt-onze minutes : des compositions originales et des pages de Satie, Chopin et Bach, jouées par le moteur du jeu. En jeu, elles viennent de temps en temps, doucement, selon le lieu ; on peut les couper dans les options. Ici, elles sont plus fortes que dans le jeu.</p></div><div class="zones">` +
  zones.map((z) => `<div class="zone"><h3>${esc(z.nom)}</h3><ol>${z.pistes.map((p) => `<li><button type="button" class="piste" data-n="${p.n}" aria-pressed="false"><span class="ic" aria-hidden="true">▶</span><span class="t">${esc(p.titre)}</span><span class="d">${esc(p.duree.replace(' min ', ':'))}</span><span class="a">${esc(auteur(p))} · ${esc(p.instr)}</span></button></li>`).join('')}</ol></div>`).join('') + '</div></section>';
html += `<footer><span>Les images sont des captures du jeu et de son wiki, sans retouche ; les affiches sont composées à partir de ces captures.</span><span>Le jeu se joue dans le navigateur, sur ordinateur ; le wiki s’ouvre à côté.</span></footer>`;
$('#album').innerHTML = html;
$('#nav').innerHTML = nav.join('');

// la visionneuse
let cur = -1, retour = null;
function voir(k) {
  cur = (k + toutes.length) % toutes.length;
  const im = toutes[cur];
  $('#v-img').src = `img/${im.id}.jpg`; $('#v-img').alt = im.legende;
  $('#v-leg').innerHTML = `${esc(im.legende)}<span>${cur + 1} / ${toutes.length}</span>`;
}
function ouvrir(k, el) { retour = el; voir(k); $('#vis').hidden = false; document.body.style.overflow = 'hidden'; $('#v-fermer').focus(); }
function fermer() { $('#vis').hidden = true; document.body.style.overflow = ''; if (retour) retour.focus(); }
$('#album').addEventListener('click', (e) => { const b = e.target.closest('button[data-k]'); if (b) ouvrir(+b.dataset.k, b); });
$('#v-fermer').onclick = fermer; $('#v-prec').onclick = () => voir(cur - 1); $('#v-suiv').onclick = () => voir(cur + 1);
$('#vis').addEventListener('click', (e) => { if (e.target.id === 'vis') fermer(); });
document.addEventListener('keydown', (e) => {
  if ($('#vis').hidden) return;
  if (e.key === 'Escape') fermer(); else if (e.key === 'ArrowLeft') voir(cur - 1); else if (e.key === 'ArrowRight') voir(cur + 1);
});

// le lecteur
const audio = $('#audio');
let piste = null;
const fmt = (s) => isFinite(s) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}` : '';
function jouer(n) {
  const p = DATA.pistes.find((x) => x.n === n); if (!p) return;
  if (piste === n) { audio.paused ? audio.play().catch(() => {}) : audio.pause(); return; }
  piste = n; audio.src = `audio/${p.mp3}`; audio.play().catch(() => {});
  $('#lecteur').hidden = false; $('#l-titre').textContent = p.titre; $('#l-auteur').textContent = `${auteur(p)} · ${p.zone}`;
  for (const b of document.querySelectorAll('.piste')) { const on = +b.dataset.n === n; b.setAttribute('aria-pressed', on); }
}
function majIcones() {
  for (const b of document.querySelectorAll('.piste')) b.querySelector('.ic').textContent = +b.dataset.n === piste && !audio.paused ? '❚❚' : '▶';
  $('#l-jouer').textContent = audio.paused ? '▶' : '❚❚'; $('#l-jouer').setAttribute('aria-label', audio.paused ? 'Lecture' : 'Pause');
}
$('#album').addEventListener('click', (e) => { const b = e.target.closest('.piste'); if (b) jouer(+b.dataset.n); });
$('#l-jouer').onclick = () => { audio.paused ? audio.play().catch(() => {}) : audio.pause(); };
const suivante = () => { const i = DATA.pistes.findIndex((x) => x.n === piste); jouer(DATA.pistes[(i + 1) % DATA.pistes.length].n); };
$('#l-suite').onclick = suivante;
audio.addEventListener('play', majIcones); audio.addEventListener('pause', majIcones); audio.addEventListener('ended', suivante);
audio.addEventListener('timeupdate', () => { if (audio.duration) { $('#l-pos').value = Math.round(audio.currentTime / audio.duration * 1000); $('#l-temps').textContent = `${fmt(audio.currentTime)} / ${fmt(audio.duration)}`; } });
$('#l-pos').addEventListener('input', (e) => { if (audio.duration) audio.currentTime = e.target.value / 1000 * audio.duration; });
</script>
